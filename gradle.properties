android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Memory configuration for Gradle Daemon and Kotlin Daemon
# KSP with Hilt and Room requires sufficient Heap and Metaspace to avoid OOM daemon crashes
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC

# Disable Kotlin and KSP incremental compilation on Windows to prevent daemon file lock crashes
# (Fixes "Could not close incremental caches" and "failed to make parent directories" exceptions)
kotlin.incremental=false
ksp.incremental=false
